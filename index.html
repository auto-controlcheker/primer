    <div class="staff-grid"></div>

    <div id="passContainer" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:1000; align-items:center; justify-content:center; flex-direction:column; color:white; font-family:sans-serif;">
        <h2 id="workerName">Имя сотрудника</h2>
        <div style="display:flex; gap:20px; margin-top:20px;">
            <button class="action-btn" onclick="sendToSheet('Пришел', event)" style="padding:15px 30px; background:green; color:white; border:none; border-radius:8px; cursor:pointer;">ПРИШЕЛ</button>
            <button class="action-btn" onclick="sendToSheet('Ушел', event)" style="padding:15px 30px; background:red; color:white; border:none; border-radius:8px; cursor:pointer;">УШЕЛ</button>
        </div>
        <button onclick="document.getElementById('passContainer').style.display='none'" style="margin-top:30px; background:none; border:1px solid white; color:white; cursor:pointer; padding:5px 10px;">Отмена</button>
    </div>

    <script src="script.js"></script> 
</body>
