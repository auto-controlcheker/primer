<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>СКУД Карамель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1 class="logo-text">Карамель</h1>
        
        <div class="staff-grid">
            <button class="name-btn" onclick="selectMe('Вячеслав Валерьевич')">Вячеслав Валерьевич</button>
            <button class="name-btn" onclick="selectMe('Алёна Дмитриевна')">Алёна Дмитриевна</button>
            <button class="name-btn" onclick="selectMe('Галина Александровна')">Галина Александровна</button>
            <button class="name-btn" onclick="selectMe('Мадина Жансериковна')">Мадина Жансериковна</button>
            <button class="name-btn" onclick="selectMe('Марина')">Марина</button>
            <button class="name-btn" onclick="selectMe('Сандугаш')">Сандугаш</button>
        </div>

        <div id="passContainer">
            <div class="modal-card">
                <h2 id="workerName"></h2>
                <p style="color: #666; margin-bottom: 20px; font-size: 16px;">Выберите действие:</p>
                
                <button class="modal-btn btn-in" onclick="sendToSheet('Пришел')">Я ПРИШЕЛ / ШЛА</button>
                <button class="modal-btn btn-out" onclick="sendToSheet('Ушел')">Я УШЕЛ / ШЛА</button>
                
                <button class="btn-change" onclick="resetWorker()">Это не я</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
