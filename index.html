<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СКУД Карамель</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <h1 class="logo-text">Карамель</h1>
        
        <div id="staffButtons" class="staff-grid">
            <button class="name-btn" onclick="openModal('Вячеслав Валерьевич')">Вячеслав Валерьевич</button>
            <button class="name-btn" onclick="openModal('Алёна Дмитриевна')">Алёна Дмитриевна</button>
            <button class="name-btn" onclick="openModal('Галина Александровна')">Галина Александровна</button>
            <button class="name-btn" onclick="openModal('Мадина Жансериковна')">Мадина Жансериковна</button>
            <button class="name-btn" onclick="openModal('Марина')">Марина</button>
            <button class="name-btn" onclick="openModal('Сандугаш')">Сандугаш</button>
            </div>

        <div id="modal" class="modal-overlay">
            <div class="modal-content">
                <h3 id="selectedName">Имя Фамилия</h3>
                <p>Выберите действие:</p>
                <button class="action-btn btn-in" onclick="processAction('Пришел')">Я ПРИШЕЛ / ШЛА</button>
                <button class="action-btn btn-out" onclick="processAction('Ушел')">Я УШЕЛ / ШЛА</button>
                <button class="btn-cancel" onclick="closeModal()">Это не я</button>
                <p id="status"></p>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
